openapi: "3"
info:
  title: Example API
  version: "1"
servers:
- url: http://localhost:8005
  description: Test API server.
paths:
  /echo:
    post:
      operationId: echo
      description: Echo back body with the same content type.
      parameters:
      - name: q
        x-cli-name: echo-query
        in: query
      - name: x-request-id
        in: header
        schema:
          type: string
      - name: since
        in: query
        # Exercises date-time normalization: relative values like 24h and 7d are
        # turned into RFC 3339 before the query is built. Required and optional
        # date-time params render differently, so smoke compiles both shapes.
        description: Only echo events after this time.
        required: true
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Only echo events before this time.
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        # Exercises schema-driven value checking: a value outside the enum is
        # refused before any request is built.
        description: Only echo when the widget is in this state.
        schema:
          type: string
          enum:
          - active
          - archived
      requestBody:
        content:
          application/json:
            example:
              hello: world
      responses:
        200:
          description: Successful response
          content:
            application/json:
              example:
                hello: world
  /widgets/{id}:
    delete:
      operationId: deleteWidget
      # Exercises the destructive-command confirm gate, --force flag, and the
      # flag-name reservation (the `force` query parameter collides with --force).
      description: Delete a widget by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: force
        in: query
        # Collides with the generated --force; renamed to --param-force.
        description: Force-delete even if the widget has dependents.
        schema:
          type: boolean
      responses:
        204:
          description: Deleted
