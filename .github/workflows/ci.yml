name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make verify

  # The official MCP conformance suite (pinned in conformance/run.sh) against a
  # generated server, for the 2025-11-25 and 2026-07-28 requirement sets. Every
  # check it cannot pass is baselined with its reason in
  # conformance/expected-failures-*.yaml; anything else fails the job, as does
  # a baselined check that starts passing.
  conformance:
    name: mcp conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make conformance

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        shell: bash
        run: |
          set +e
          output="$(govulncheck ./... 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "## govulncheck"
              echo
              echo "govulncheck reported vulnerabilities. This job is advisory until Bartolo raises its minimum supported Go version or the affected code paths are remediated."
              echo
              echo '```text'
              printf '%s\n' "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
