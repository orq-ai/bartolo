name: release

# Tag-driven release. On push to main, derive the next version from the
# conventional-commit subjects since the last tag, push that tag, and publish a
# GitHub Release. There is nothing to build or upload: bartolo ships through
# `go install`, and the proxy serves whatever the tag points at.
#
# The tag is the only place a version is recorded — `bartolo version` reports
# the module version from its build info — so nothing here can drift out of sync
# with the code the way the hand-cut tags did (v0.4.4 shipped reporting 0.4.3).
#
# Every version decision is made by ./cmd/next-version, which is unit-tested;
# this file only reacts to what it reports. The steps are idempotent, so a run
# that dies between pushing the tag and publishing the release is repaired by
# the next one instead of leaving a tag the module proxy serves with no release
# to explain it.
#
# Only a tag is pushed, never a commit to main, so the plain GITHUB_TOKEN is
# enough and main's protection stays untouched.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_level:
        description: "Force bump (major/minor/patch); blank = derive from commits. Required to release a major."
        required: false
        default: ""
        type: choice
        options: ["", "major", "minor", "patch"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the tag + create the GitHub Release

jobs:
  release:
    name: tag + release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for version derivation
          persist-credentials: true # the tag push below reuses this credential

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Decide the release
        id: version
        env:
          FORCE_LEVEL: ${{ inputs.force_level }}
        run: |
          set -euo pipefail
          if [ -n "$FORCE_LEVEL" ]; then
            go run ./cmd/next-version -github-output -force "$FORCE_LEVEL" | tee -a "$GITHUB_OUTPUT"
          else
            go run ./cmd/next-version -github-output | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Refuse an unconfirmed major
        # A major bump needs a human. Fail rather than skip: a blocked release
        # must not look like a docs-only push.
        if: steps.version.outputs.major_bump == 'true' && inputs.force_level == ''
        run: |
          echo "::error::Refusing an automatic major bump ${{ steps.version.outputs.current }} -> ${{ steps.version.outputs.next }}. Re-run this workflow via workflow_dispatch with force_level=major to confirm, or force_level=minor/patch to ship the breaking changes at a lower level."
          exit 1

      - name: Push the tag
        if: steps.version.outputs.released == 'true'
        env:
          TAG: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists locally."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Ensure the release exists
        # Covers the tag just pushed and, when there is nothing new to release,
        # the last tag — so a release that failed to publish after its tag went
        # out is backfilled here rather than staying missing forever.
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already published."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
