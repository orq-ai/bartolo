version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # The PR title must satisfy the conventional-commit check or the PR cannot
    # be merged. "fix" so a dependency bump actually cuts a release: a patched
    # dependency that never reaches a tag is the failure govulncheck exists to
    # catch. Every Go dependency is compiled into the binary a consumer installs,
    # so there is no subset of these bumps that a release could skip — and
    # dependabot cannot vary the prefix per update type anyway. Version churn is
    # capped instead by the group below: one grouped PR per week, so at most one
    # patch release a week comes from dependency updates.
    commit-message:
      prefix: "fix"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Release-neutral: an action bump changes nothing a consumer installs.
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      github-actions:
        patterns:
          - "*"
